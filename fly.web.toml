app = "quorum-web-gowri"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.web"
  [build.args]
    NEXT_PUBLIC_API_URL = "https://quorum-api-gowri.fly.dev"
    NEXT_PUBLIC_WS_URL = "wss://quorum-api-gowri.fly.dev/v1/ws"

[env]
  PORT = "3000"
  NEXT_PUBLIC_API_URL = "https://quorum-api-gowri.fly.dev"
  NEXT_PUBLIC_WS_URL = "wss://quorum-api-gowri.fly.dev/v1/ws"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
  